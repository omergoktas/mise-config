# The secrets of Ömer's own mise file, encrypted with age to the keys that
# config.toml's head comment lists. Each group is a task template that the
# tasks of config.toml extend, so a secret reaches only those tasks. mise
# loads this file with config.toml; `mise run secret --global <template>
# <NAME>` writes it. The og-mise skill of the Yastik project explains every
# line.

[task_templates.github.env]
# A GitHub token for gh and git; made at github.com/settings/tokens.
GH_TOKEN = { age = "" }
# git's login for GitHub with that token, which mise hands git as settings:
# no credential helper of the system's or the user's, and one that answers
# with the token.
GIT_CONFIG_COUNT = "2"
GIT_CONFIG_KEY_0 = "credential.helper"
GIT_CONFIG_VALUE_0 = ""
GIT_CONFIG_KEY_1 = "credential.https://github.com.helper"
GIT_CONFIG_VALUE_1 = '!f() { test "$1" = get && echo username=x-access-token && echo "password=$GH_TOKEN"; }; f'

[task_templates.remote.env]
# The test boxes' SSH password, which remotes.conf hands to tssh; redact = false
# lets the remote tasks read pipes.
SSHPASS = { age = "", redact = false }

[task_templates.sound.env]
# ElevenLabs' API key, for sound effects; made at elevenlabs.io under
# Developers > API Keys.
ELEVENLABS_API_KEY = { age = "" }
# Google's Gemini API keys, for speech, separated by commas, the free ones
# first; made at aistudio.google.com/apikey.
GEMINI_API_KEY = { age = "" }

[task_templates.claude.env]
# The Claude API key; made at platform.claude.com under API keys.
CLAUDE_API_KEY = { age = "" }
