# Ömer's own mise file, loaded in every folder: every development tool and
# task he uses in any project. Their secrets lie encrypted in fnox's own
# global file, fnox/config.toml beside this file, and each task that needs one
# runs its program through `fnox exec --only <NAME>`. A project's own mise files
# hold only what its build needs. The og-mise skill of the Yastik project
# explains every line.

min_version = "2026.11.10"

[settings]
experimental = true
task.quiet = true
activate_aggressive = true
pin = true
use_versions_host_track = false
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64", "windows-x64", "windows-arm64"]
paranoid = ["config"]
shims_dir = "~/.local/share/mise/bin"
trusted_config_paths = ["~/Projeler/Yastik"]

[tool_config]
locked = true

[tools]
python = "3.12.16"
uv = "0.13.7"
"pipx:clang-format" = "23.1.5"
"pipx:gersemi" = "0.29.2"
ruff = "0.17.4"
jactionlint = "2.6.0"
pinact = "5.0.2"
gh = "2.103.3"
tombi = "1.11.2"
"pipx:copier" = "9.19.1"
tssh = "0.1.27"
trzsz-go = "1.2.0"
fnox = "1.50.0"

[tools."http:git"]
version = "2.56.1"

[tools."http:git".platforms]
macos-arm64 = { url = "https://github.com/desktop/dugite-native/releases/download/v{{ version }}/dugite-native-v{{ version }}-238326e-macOS-arm64.tar.gz", bin_path = "bin" }
macos-x64 = { url = "https://github.com/desktop/dugite-native/releases/download/v{{ version }}/dugite-native-v{{ version }}-238326e-macOS-x64.tar.gz", bin_path = "bin" }
linux-arm64 = { url = "https://github.com/desktop/dugite-native/releases/download/v{{ version }}/dugite-native-v{{ version }}-238326e-ubuntu-arm64.tar.gz", bin_path = "bin" }
linux-x64 = { url = "https://github.com/desktop/dugite-native/releases/download/v{{ version }}/dugite-native-v{{ version }}-238326e-ubuntu-x64.tar.gz", bin_path = "bin" }
windows-arm64 = { url = "https://github.com/desktop/dugite-native/releases/download/v{{ version }}/dugite-native-v{{ version }}-238326e-windows-arm64.tar.gz", bin_path = "cmd" }
windows-x64 = { url = "https://github.com/desktop/dugite-native/releases/download/v{{ version }}/dugite-native-v{{ version }}-238326e-windows-x64.tar.gz", bin_path = "cmd" }

# Windows' bash: niubash, a native shell, and BusyBox for the commands it
# lacks, hard-linked by name into BusyBox's links folder, the one folder mise
# puts on PATH. BusyBox's unzip is left out: it writes outside its target.
# Claude Code finds niubash through its bash shim (shims_dir above).
[tools."http:niubash"]
version = "1.5.1"
os = ["windows"]

[tools."http:niubash".platforms]
windows-arm64 = { url = "https://github.com/unixwin/niubash/releases/download/v{{ version }}/niubash-v{{ version }}-win-arm64.7z" }
windows-x64 = { url = "https://github.com/unixwin/niubash/releases/download/v{{ version }}/niubash-v{{ version }}-win-x64.7z" }

[tools."http:busybox-w32"]
version = "FRP-6354-g5f09fb446"
os = ["windows"]
bin_path = "links"
postinstall = 'for %f in ("%MISE_TOOL_INSTALL_PATH%\links\busybox-w64*.exe") do @(for %c in (awk bc bunzip2 bzcat bzip2 dc ed gunzip gzip hd iconv lzcat lzma uncompress unlzma unxz uudecode uuencode uuidgen wget xz xzcat zcat) do @"%~f" ln -f "%~f" "%MISE_TOOL_INSTALL_PATH%\links\%c.exe")'

[tools."http:busybox-w32".platforms]
windows-arm64 = { url = "https://frippery.org/files/busybox/busybox-w64a-{{ version }}.exe" }
windows-x64 = { url = "https://frippery.org/files/busybox/busybox-w64-{{ version }}.exe" }

[env]
RUFF_CACHE_DIR = "{{ xdg_cache_home }}/ruff"
NIU_UPDATE_CHECK = "0"
# fnox's global file, with the secrets of these tasks, lives in this folder's
# fnox/ subfolder, since fnox calls it config.toml, a name mise reads here as
# its own; beside it the developer's age key, which opens fnox's secrets, the
# project's and these tasks' alike.
FNOX_CONFIG_DIR = "{{ xdg_config_home }}/mise/fnox"
FNOX_AGE_KEY_FILE = "{{ xdg_config_home }}/mise/fnox/keys/age-pc.txt"
# Colors in every program's output, also in the pipes Ninja runs build steps
# through, and in CMake's own diagnostics. gh then colors even the JSON it
# writes into a pipe, and NO_COLOR does not stop it: a command whose output a
# program reads sets CLICOLOR_FORCE=0.
CLICOLOR_FORCE = "1"
CMAKE_COLOR_DIAGNOSTICS = "TRUE"
# AtQt builds its own build tools, such as imageutil, as hardened Debug builds.
ATQT_TOOLS_DEBUG_HARDENING_ENABLED = "TRUE"
GIT_EXEC_PATH = { value = "{% if tools['http:git'] is defined %}{{ tools['http:git'].path }}/{% if os() == 'windows' %}{% if arch() == 'arm64' %}clangarm64{% else %}mingw64{% endif %}/{% endif %}libexec/git-core{% endif %}", tools = true }
GIT_TEMPLATE_DIR = { value = "{% if tools['http:git'] is defined %}{{ tools['http:git'].path }}/{% if os() == 'windows' %}{% if arch() == 'arm64' %}clangarm64{% else %}mingw64{% endif %}/{% endif %}share/git-core/templates{% endif %}", tools = true }
GIT_CONFIG_SYSTEM = { value = "{% if tools['http:git'] is defined %}{{ tools['http:git'].path }}/etc/gitconfig{% endif %}", tools = true }

# The gh and git tasks extend this template. git, which gh also runs, takes
# GitHub's login from GH_TOKEN through these two settings: no helper of the
# system's or the user's files, so no keychain keeps the token, and a helper for
# github.com that answers with GH_TOKEN, which mise hands on as written for $$,
# since fnox sets it only when the task runs.
[task_templates.github.env]
GIT_CONFIG_COUNT = "2"
GIT_CONFIG_KEY_0 = "credential.helper"
GIT_CONFIG_VALUE_0 = ""
GIT_CONFIG_KEY_1 = "credential.https://github.com.helper"
GIT_CONFIG_VALUE_1 = '!f() { test "$1" = get && echo username=x-access-token && echo "password=$$GH_TOKEN"; }; f'

[tasks.gh]
description = "Run GitHub's gh with your token, such as `mise run gh run list`"
extends = "github"
dir = "{{cwd}}"
raw = true
raw_args = true
run = "fnox exec --only GH_TOKEN -- gh"

[tasks.git]
description = "Run git with your GitHub login, such as `mise run git push`"
extends = "github"
dir = "{{cwd}}"
raw = true
raw_args = true
run = "fnox exec --only GH_TOKEN -- git"

# The remote tasks start tssh on remotes.conf, whose PasswordCommand lines ask
# fnox for each host's password, so every task works with every host there.
[tasks.remote]
description = "Open tssh's menu of the hosts in remotes.conf, a shell on the host named, such as `mise run remote kokpit`, or run a quoted command there, such as `mise run remote kokpit 'uname -a'`"
dir = "{{cwd}}"
raw = true
raw_args = true
run = 'tssh -F "{{xdg_config_home}}/mise/remotes.conf" --dragfile'

[tasks."remote:linux"]
description = "Open a shell on the Linux test box, or run a quoted command there, such as `mise run remote:linux 'uname -a'`"
dir = "{{cwd}}"
raw = true
raw_args = true
run = 'tssh -F "{{xdg_config_home}}/mise/remotes.conf" --dragfile linux-box'

[tasks."remote:windows"]
description = "Open a shell on the Windows test box, or run a quoted command there, such as `mise run remote:windows 'uname -a'`"
dir = "{{cwd}}"
raw = true
raw_args = true
run = 'tssh -F "{{xdg_config_home}}/mise/remotes.conf" --dragfile windows-box'

[tasks."remote:kokpit"]
description = "Open a shell on the kokpit server, or run a quoted command there, such as `mise run remote:kokpit 'uname -a'`"
dir = "{{cwd}}"
raw = true
raw_args = true
run = 'tssh -F "{{xdg_config_home}}/mise/remotes.conf" --dragfile kokpit'

[tasks."remote:upload"]
description = "Upload files to a folder on a host of remotes.conf with trzsz, whose trz the host needs, such as `mise run remote:upload linux-box audit app.tar file.txt`"
dir = "{{cwd}}"
usage = '''
arg "<host>" help="a host of remotes.conf, such as linux-box, windows-box or kokpit"
arg "<folder>" help="the folder on the host, relative to its home folder, made if missing"
arg "<files>..." help="the files or folders here to upload"
'''
run = 'tssh -F "{{xdg_config_home}}/mise/remotes.conf"{% for file in usage.files %} --upload-file "{{file}}"{% endfor %} {{usage.host}} "mkdir -p {{usage.folder}} && trz -y -d {{usage.folder}}"'

[tasks."remote:download"]
description = "Download a file from a host of remotes.conf, whose python3 copies it, into a file here, such as `mise run remote:download linux-box audit/log.txt log.txt`"
dir = "{{cwd}}"
usage = '''
arg "<host>" help="a host of remotes.conf, such as linux-box, windows-box or kokpit"
arg "<file>" help="the file on the host, relative to its home folder"
arg "<target>" help="the file here to write"
'''
run = 'tssh -F "{{xdg_config_home}}/mise/remotes.conf" {{usage.host}} "python3 -c \"import shutil, sys; shutil.copyfileobj(open(sys.argv[1], sys.argv[2]), sys.stdout.buffer)\" {{usage.file}} rb" > "{{usage.target}}"'

[tasks.sound]
description = "Run a Python script with the sound services' keys, such as `mise run sound tools/sounds/takes.py`"
dir = "{{cwd}}"
run = "fnox exec --only ELEVENLABS_API_KEY --only GEMINI_API_KEY -- python3"

[tasks.translate]
description = "Translate an AtQt project's new and changed texts into every language, such as `mise run translate macos-arm64-debug`"
usage = 'arg "<preset>" help="A configure preset of the project"'
dir = "{{cwd}}"
run = 'cmake --preset "{{usage.preset}}" -DATQT_TRANSLATION_ENABLED=TRUE && cmake --build "build/{{usage.preset}}" --target atqt_translate'

# AtQt's translator reads the Claude API key as ATQT_TRANSLATION_API_KEY. mise
# asks fnox for it only when this task runs, and prints it as [redacted]. Never
# give exec() a cache_key: mise would keep the key in its cache folder.
[tasks.translate.env]
ATQT_TRANSLATION_API_URL = "https://api.anthropic.com/v1/messages"
ATQT_TRANSLATION_MODEL = "claude-opus-5-5"
ATQT_TRANSLATION_API_KEY = { value = "{{ exec(command='fnox get CLAUDE_API_KEY') }}", redact = true }
