# The test boxes, for tssh, which the box tasks of config.toml start with
# `tssh -F` on this file. It holds no secret: tssh runs the PasswordCommand
# when a box asks for the password, and the command prints SSHPASS, which only
# the box tasks' environment holds. tssh starts it with no shell, and Python
# is a tool of config.toml on every platform, where Windows has no printenv.

Host linux-box
    HostName omergoktas.com
    Port 2222
    User aibox
    StrictHostKeyChecking no
    #!! PasswordCommand python3 -c "import os, sys; sys.stdout.write(os.environ['SSHPASS'])"

Host windows-box
    HostName omergoktas.com
    Port 5555
    User omergoktas
    StrictHostKeyChecking no
    #!! PasswordCommand python3 -c "import os, sys; sys.stdout.write(os.environ['SSHPASS'])"
