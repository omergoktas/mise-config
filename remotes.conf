# The remote machines, the test boxes and the kokpit server, for tssh, which
# the remote tasks of mise.toml start with `tssh -F` on this file. It holds no
# secret: when a host asks for the password, tssh runs the host's
# PasswordCommand, `fnox get <NAME>`, with no shell, and reads the password
# from its output, so the password never stands in a command line or an
# environment. fnox finds its global file and key through the global mise
# file's [env], which mise sets for the tasks, and its shim for any other
# command. A new host needs only its block here and its password stored with
# `fnox set --global <NAME> --provider age`.

Host linux-box
    HostName omergoktas.com
    Port 2222
    User aibox
    StrictHostKeyChecking no
    #!! PasswordCommand fnox get DEVBOX_PASSWORD

Host windows-box
    HostName omergoktas.com
    Port 5555
    User omergoktas
    StrictHostKeyChecking no
    #!! PasswordCommand fnox get DEVBOX_PASSWORD

Host kokpit
    HostName omergoktas.com
    Port 22
    User omergoktas
    StrictHostKeyChecking yes
    #!! PasswordCommand fnox get KOKPIT_PASSWORD
